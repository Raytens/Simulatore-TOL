best.","commonMistake":"Omettere «the» o usare «more good»."},{"id":"EN-019","section":"Inglese","topic":"used to per abitudini passate","difficulty":"media","question":"When I was a child, I ______ swim in the river every summer.","options":{"A":"used to","B":"use to","C":"was used to","D":"am used to","E":"using to"},"correctAnswer":"A","explanationSteps":["L'azione è un'abitudine passata, ormai non più valida: si usa «used to + infinito».","«be used to» è un'altra costruzione e significa «essere abituato a», seguita da -ing."],"distractorAnalysis":{"B":"«use to» si usa solo in negative e interrogative con «did» («didn't use to»).","C":"«was used to» richiede un gerundio o un nome, non l'infinito.","D":"«am used to» è al presente e richiede anch'esso un gerundio.","E":"Forma in -ing priva di ausiliare."},"concept":"used to + infinito per abitudini passate; be used to + -ing per l'abitudine presente.","commonMistake":"Confondere «used to» e «be used to»."},{"id":"EN-020","section":"Inglese","topic":"Pronomi relativi: whose","difficulty":"media","question":"The man ______ car was stolen called the police.","options":{"A":"who","B":"which","C":"that","D":"whom","E":"whose"},"correctAnswer":"E","explanationSteps":["La relativa esprime possesso: la macchina appartiene all'uomo.","Il pronome relativo che esprime possesso è «whose»."],"distractorAnalysis":{"A":"«who» è soggetto o complemento riferito a persone, ma non esprime possesso.","B":"«which» si riferisce a cose.","C":"«that» non può esprimere possesso.","D":"«whom» è la forma oggetto riferita a persone."},"concept":"whose + nome esprime possesso e vale sia per persone sia per cose.","commonMistake":"Usare «who» o «that» davanti a un sostantivo posseduto."},{"id":"EN-021","section":"Inglese","topic":"Pronomi relativi: where","difficulty":"media","question":"That's the small hotel ______ we stayed last summer.","options":{"A":"which","B":"who","C":"where","D":"whose","E":"when"},"correctAnswer":"C","explanationSteps":["L'antecedente «hotel» è un luogo e la relativa indica dove si è soggiornato.","Il relativo di luogo è «where»; «which» richiederebbe una preposizione («in which»)."],"distractorAnalysis":{"A":"«which» senza preposizione lascia la frase incompleta («which we stayed» non è corretto).","B":"«who» si riferisce a persone.","D":"«whose» esprime possesso.","E":"«when» introduce una relativa di tempo."},"concept":"where introduce una relativa che specifica un luogo.","commonMistake":"Usare «which» senza la preposizione («in which»)."},{"id":"EN-022","section":"Inglese","topic":"Gerundio dopo enjoy","difficulty":"facile","question":"She enjoys ______ new languages, so she's studying Korean this year.","options":{"A":"to learn","B":"learn","C":"to learning","D":"learning","E":"learns"},"correctAnswer":"D","explanationSteps":["Il verbo «enjoy» è seguito da un altro verbo in forma -ing.","Quindi si usa «learning»."],"distractorAnalysis":{"A":"Dopo «enjoy» non si usa l'infinito con «to».","B":"L'infinito senza «to» non è la forma richiesta da «enjoy».","C":"«to learning» è una combinazione errata.","E":"Forma coniugata: dopo «enjoys» non può seguire un altro verbo coniugato."},"concept":"Verbi seguiti dal gerundio: enjoy, avoid, finish, mind, suggest.","commonMistake":"Usare l'infinito dopo «enjoy», come in italiano («ama imparare»)."},{"id":"EN-023","section":"Inglese","topic":"Reported speech: backshift","difficulty":"media","question":"He told me that he ______ the report the day before.","options":{"A":"finishes","B":"had finished","C":"has finished","D":"will finish","E":"was finish"},"correctAnswer":"B","explanationSteps":["Il verbo introduttivo «told» è al passato e «the day before» colloca l'azione prima di quel momento.","Nel discorso indiretto, l'azione anteriore si esprime con il past perfect: «had finished»."],"distractorAnalysis":{"A":"Present simple: non rispetta la concordanza dei tempi.","C":"Present perfect: non è compatibile con «the day before» in un racconto al passato.","D":"Futuro: contraddice «the day before».","E":"Forma grammaticalmente errata."},"concept":"Nel reported speech l'azione anteriore al verbo introduttivo passa al past perfect.","commonMistake":"Mantenere il tempo originale del discorso diretto."},{"id":"EN-024","section":"Inglese","topic":"Reported questions: ordine delle parole","difficulty":"media","question":"She asked me where ______.","options":{"A":"did I live","B":"do I live","C":"I lived","D":"lived I","E":"was I living"},"correctAnswer":"C","explanationSteps":["In una domanda indiretta l'ordine è soggetto + verbo, senza ausiliare «do/did» né inversione.","Il verbo introduttivo è al passato, quindi il verbo si porta al past simple: «I lived»."],"distractorAnalysis":{"A":"Mantiene l'inversione e l'ausiliare della domanda diretta.","B":"Domanda diretta al presente: non è un'indiretta.","D":"Ordine soggetto-verbo invertito in modo errato.","E":"Inversione con ausiliare tipica della domanda diretta."},"concept":"Nelle domande indirette l'ordine è affermativo e i tempi seguono la concordanza.","commonMistake":"Usare l'ordine della domanda diretta («where did I live»)."},{"id":"EN-025","section":"Inglese","topic":"Phrasal verbs: put off","difficulty":"media","question":"The meeting has been ______ until next week because the manager is ill.","options":{"A":"put on","B":"put out","C":"put up","D":"put in","E":"put off"},"correctAnswer":"E","explanationSteps":["La riunione è spostata a una data successiva: significa «postponed».","Il phrasal verb con questo significato è «put off»."],"distractorAnalysis":{"A":"«put on» significa indossare o organizzare uno spettacolo.","B":"«put out» significa spegnere o pubblicare.","C":"«put up» significa alzare, erigere o ospitare.","D":"«put in» significa inserire o installare."},"concept":"put off = posticipare; il significato dei phrasal verbs dipende dalla particella.","commonMistake":"Scegliere una particella a caso senza verificarne il significato."},{"id":"EN-026","section":"Inglese","topic":"False friends: sensible / sensitive","difficulty":"media","question":"Don't say that to her; she is very ______ and gets upset easily.","options":{"A":"sensible","B":"sensitive","C":"sensational","D":"sense","E":"sensed"},"correctAnswer":"B","explanationSteps":["Il contesto descrive una persona che si offende facilmente: è l'italiano «sensibile».","In inglese questo significato è espresso da «sensitive»; «sensible» significa invece «ragionevole»."],"distractorAnalysis":{"A":"«sensible» = ragionevole, assennato: falso amico di «sensibile».","C":"«sensational» = sensazionale, straordinario.","D":"«sense» è un nome (senso) e non può seguire «very» come aggettivo.","E":"«sensed» è un participio e non descrive una persona in questo modo."},"concept":"False friend: sensible (ragionevole) vs sensitive (sensibile).","commonMistake":"Tradurre «sensibile» con «sensible»."},{"id":"EN-027","section":"Inglese","topic":"Funzioni comunicative: richieste cortesi","difficulty":"media","question":"\"Would you mind closing the window? It's freezing in here.\" \"______ I'll do it now.\"","options":{"A":"Yes, I would.","B":"Not at all.","C":"Yes, of course not.","D":"You're welcome.","E":"I'm very glad."},"correctAnswer":"B","explanationSteps":["«Would you mind...?» chiede se la richiesta dà fastidio: per accettare si risponde in senso negativo.","«Not at all» significa «Per niente» e si accorda con «I'll do it now»."],"distractorAnalysis":{"A":"«Yes, I would» significa che dà fastidio, in contrasto con «I'll do it now».","C":"Risposta incoerente e scorretta.","D":"«You're welcome» si usa per rispondere a un ringraziamento.","E":"Non risponde alla richiesta."},"concept":"Con «Would you mind...?» si accetta con «Not at all» o «Of course not».","commonMistake":"Rispondere «Yes» pensando di acconsentire, mentre in inglese significa rifiutare."},{"id":"EN-028","section":"Inglese","topic":"Connettivi: despite / although","difficulty":"difficile","question":"______ the heavy traffic, we arrived on time.","options":{"A":"Although","B":"Because","C":"However","D":"But","E":"Despite"},"correctAnswer":"E","explanationSteps":["Dopo lo spazio vuoto segue un gruppo nominale («the heavy traffic»), non una proposizione con verbo.","Con un nome si usa «Despite»; «Although» richiede un soggetto e un verbo."],"distractorAnalysis":{"A":"«Although» introduce una subordinata con verbo.","B":"«Because» introduce una proposizione con verbo e ha valore causale.","C":"«However» collega frasi autonome e non precede un nome.","D":"«But» è una congiunzione coordinante e non apre la frase in questo modo."},"concept":"Despite / in spite of + nome o gerundio; although + soggetto + verbo.","commonMistake":"Usare «although» davanti a un sostantivo."},{"id":"EN-029","section":"Inglese","topic":"such a / so","difficulty":"media","question":"It was ______ a boring lecture that half of the students fell asleep.","options":{"A":"such","B":"so","C":"too","D":"very","E":"much"},"correctAnswer":"A","explanationSteps":["Dopo lo spazio c'è «a boring lecture»: articolo, aggettivo e sostantivo.","Con questa struttura si usa «such»; «so» si usa davanti ad aggettivi senza sostantivo."],"distractorAnalysis":{"B":"«so» precede un aggettivo o un avverbio, non «a + sostantivo».","C":"«too» indica eccesso e non regge questa struttura.","D":"«very» non si combina con «a boring lecture» in questa struttura consecutiva.","E":"«much» non si usa con «a + aggettivo + sostantivo»."},"concept":"such a + aggettivo + sostantivo singolare; so + aggettivo.","commonMistake":"Dire «so a boring lecture»."},{"id":"EN-030","section":"Inglese","topic":"Question tags","difficulty":"media","question":"You haven't seen my keys, ______?","options":{"A":"haven't you","B":"do you","C":"have you","D":"did you","E":"are you"},"correctAnswer":"C","explanationSteps":["La frase principale è negativa e usa l'ausiliare «have».","La question tag ripete lo stesso ausiliare con polarità opposta: «have you?»."],"distractorAnalysis":{"A":"Tag negativa dopo frase negativa: la polarità non è opposta.","B":"Ausiliare sbagliato: la frase usa «have», non «do».","D":"Ausiliare e tempo sbagliati.","E":"L'ausiliare «are» non corrisponde a «have»."},"concept":"Le question tag riprendono l'ausiliare della frase principale con polarità opposta.","commonMistake":"Usare «do/don't» come tag per qualsiasi frase."},{"id":"CV-001","section":"Comprensione verbale","topic":"Idea principale del brano","difficulty":"media","passageId":"CV-PASSAGE-01","question":"Qual è l'idea centrale del brano?","options":{"A":"Le grandi invenzioni hanno perso importanza rispetto alla conservazione delle opere esistenti.","B":"I ponti sono le infrastrutture che si degradano più rapidamente di tutte le altre.","C":"La manutenzione è essenziale per il funzionamento delle infrastrutture ma è poco valorizzata, senza che ciò sminuisca l'innovazione.","D":"I bilanci pubblici dovrebbero destinare tutte le risorse alla manutenzione e non alle opere nuove.","E":"I progettisti dovrebbero occuparsi direttamente della riparazione delle opere che hanno ideato."},"correctAnswer":"C","explanationSteps":["Il brano sostiene che la narrazione tecnica trascura la manutenzione, necessaria alle infrastrutture e poco celebrata e finanziata.","L'ultimo capoverso precisa che valorizzare la manutenzione non significa svalutare l'invenzione: la risposta corretta riassume l'intero testo."],"distractorAnalysis":{"A":"Contraddice l'ultimo capoverso: l'autore non svaluta l'invenzione.","B":"Il brano usa il ponte solo come esempio e non lo confronta con altre infrastrutture.","D":"Il testo non propone di eliminare i fondi per le opere nuove.","E":"Il testo non attribuisce ai progettisti un compito di riparazione."},"concept":"Individuare l'idea principale: la tesi che tiene insieme tutti i capoversi, comprese le precisazioni dell'autore.","commonMistake":"Scegliere un'opzione che esaspera la tesi (la conservazione prevale) o che generalizza un esempio."},{"id":"CV-002","section":"Comprensione verbale","topic":"Informazione esplicita","difficulty":"facile","passageId":"CV-PASSAGE-01","question":"Secondo il brano, perché il successo della manutenzione è difficile da celebrare?","options":{"A":"Perché consiste nell'assenza di un guasto, che è difficile da misurare.","B":"Perché gli interventi di manutenzione costano sempre più delle opere nuove.","C":"Perché chi li esegue ha competenze tecniche inferiori a quelle dei progettisti.","D":"Perché i ponti inaugurati non richiedono più alcun controllo.","E":"Perché le cerimonie pubbliche sono vietate per gli interventi di riparazione."},"correctAnswer":"A","explanationSteps":["Il secondo capoverso afferma che il successo della manutenzione consiste nell'assenza di un guasto e che un'assenza è difficile da misurare e da celebrare.","Le altre opzioni attribuiscono al testo affermazioni che non vi compaiono o che lo contraddicono."],"distractorAnalysis":{"B":"Il testo non confronta il costo della manutenzione con quello delle opere nuove.","C":"Il testo non afferma che i manutentori siano meno competenti; anzi, ne sottolinea la conoscenza.","D":"Contraddice il primo capoverso, secondo cui il ponte va controllato anche dopo l'inaugurazione.","E":"Nel testo non si parla di divieti."},"concept":"Individuare informazioni espresse esplicitamente nel testo.","commonMistake":"Scegliere un'opzione plausibile ma non supportata dal testo."},{"id":"CV-003","section":"Comprensione verbale","topic":"Significato contestuale","difficulty":"media","passageId":"CV-PASSAGE-01","question":"Nel brano, l'aggettivo «rinviabili», riferito alle spese di manutenzione, indica spese che","options":{"A":"sono già state posticipate negli anni precedenti.","B":"devono essere ridotte in modo definitivo.","C":"costano meno delle spese per le opere nuove.","D":"si possono rimandare perché la mancata esecuzione non produce subito danni percepibili.","E":"sono imposte per legge con scadenza annuale."},"correctAnswer":"D","explanationSteps":["Il testo precisa che un intervento posticipato di un anno non sembra aver causato danni immediati: per questo la spesa viene vista come rimandabile.","«Rinviabile» significa quindi «che si può rimandare» e non «da eliminare» né «già rinviato»."],"distractorAnalysis":{"A":"Il testo descrive una tendenza generale, non rinvii già avvenuti.","B":"Rinviare significa spostare nel tempo, non ridurre o eliminare.","C":"Il testo non confronta i costi delle due categorie di spesa.","E":"Nel brano non compaiono obblighi di legge."},"concept":"Dedurre il significato di un termine dal contesto in cui compare.","commonMistake":"Interpretare «rinviabile» come «eliminabile»."},{"id":"CV-004","section":"Comprensione verbale","topic":"Inferenza","difficulty":"media","passageId":"CV-PASSAGE-01","question":"Dal brano si può dedurre che posticipare un intervento di manutenzione","options":{"A":"elimina in modo definitivo la necessità dell'intervento.","B":"può dare l'impressione di un risparmio che nel tempo si rivela illusorio.","C":"provoca sempre un danno immediatamente visibile alla struttura.","D":"è consigliato dagli storici della tecnologia per ridurre la spesa pubblica.","E":"migliora la conoscenza dei punti deboli da parte dei progettisti."},"correctAnswer":"B","explanationSteps":["Il secondo capoverso dice che il risparmio appare reale, ma che in seguito il costo della riparazione tende a crescere.","Se ne deduce che il risparmio è solo apparente."],"distractorAnalysis":{"A":"Il testo dice che senza manutenzione la struttura si degrada: la necessità non scompare.","C":"Il testo afferma che il danno spesso non è visibile fino a quando diventa grave.","D":"Gli studiosi citati descrivono il fenomeno ma non lo raccomandano.","E":"Non c'è alcun legame nel testo tra posticipo e conoscenza dei punti deboli."},"concept":"Ricavare una conclusione implicita combinando informazioni presenti nel testo.","commonMistake":"Fermarsi alla prima parte («il risparmio appare reale») e ignorare l'ultima («il costo cresce»)."},{"id":"CV-005","section":"Comprensione verbale","topic":"Funzione di un capoverso","difficulty":"difficile","passageId":"CV-PASSAGE-01","question":"Qual è la funzione dell'ultimo capoverso rispetto al resto del brano?","options":{"A":"Introdurre una nuova tesi che contraddice quanto affermato prima.","B":"Fornire un esempio concreto di un ponte danneggiato.","C":"Riassumere i dati sui costi delle riparazioni.","D":"Dimostrare che i progettisti sono inutili per la durata delle opere.","E":"Precisare la tesi, evitando di contrapporre in modo semplicistico innovazione e conservazione."},"correctAnswer":"E","explanationSteps":["L'ultimo capoverso si apre con «Non si tratta, tuttavia, di contrapporre...», cioè corregge una possibile lettura troppo netta della tesi.","Poi mostra come innovazione e conservazione si influenzano a vicenda: serve a precisare la tesi, non a cambiarla."],"distractorAnalysis":{"A":"Non contraddice i capoversi precedenti, ma li completa.","B":"L'esempio del ponte compare nel primo capoverso.","C":"Nel testo non ci sono dati numerici sui costi.","D":"Il testo dice solo che i progettisti non conoscono certi punti deboli, non che siano inutili."},"concept":"Riconoscere il ruolo di un capoverso nell'argomentazione (introduzione, esempio, precisazione, conclusione).","commonMistake":"Interpretare una precisazione come una tesi nuova o opposta."}]}</script>
  <script>
    (() => {
      "use strict";

      const app = document.getElementById("app");
      const LM009_STEPS = [
        "A è falsa: per ogni x reale, scegliendo y = x si ottiene x < x, che è falso.",
        "B è falsa: per x = 0 non esiste alcun y reale tale che x · y = 1.",
        "C è vera: per ogni x reale basta scegliere y = −x, ottenendo x + y = 0.",
        "D è falsa: per x = −1 non esiste alcun numero reale y il cui quadrato sia −1.",
        "E è falsa: non esiste un unico y reale tale che x + y = 0 per ogni x reale."
      ];
      const SECTION_DEFINITIONS = [
        { id: "LM", dataSection: "Logica, Matematica e Statistica", label: "Logica, Matematica e Statistica", shortLabel: "Logica, matematica e statistica", questionCount: 25, minutes: 65, weight: 2.6 },
        { id: "CV", dataSection: "Comprensione verbale", label: "Comprensione verbale", shortLabel: "Comprensione verbale", questionCount: 5, minutes: 10, weight: 3 },
        { id: "FI", dataSection: "Fisica", label: "Fisica", shortLabel: "Fisica", questionCount: 5, minutes: 10, weight: 2 },
        { id: "EN", dataSection: "Inglese", label: "Inglese (TENG)", shortLabel: "Inglese (TENG)", questionCount: 30, minutes: 15, weight: 1 / 3 }
      ];
      const LETTERS = ["A", "B", "C", "D", "E"];
      let bank;
      let questionsBySection;
      let state;

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;"
        })[character]);
      }

      function withBreaks(value) {
        return escapeHtml(value).replace(/\r?\n/g, "<br>");
      }

      function formatScore(value) {
        return new Intl.NumberFormat("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);
      }

      function formatDuration(milliseconds) {
        const seconds = Math.max(0, Math.round(milliseconds / 1000));
        const minutes = Math.floor(seconds / 60);
        return `${String(minutes).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function durationFor(sectionId) {
        const definition = SECTION_DEFINITIONS.find((item) => item.id === sectionId);
        return definition.minutes * 60 * 1000;
      }

      function validateBank(candidate) {
        const failures = [];
        if (!candidate || !Array.isArray(candidate.questions) || !Array.isArray(candidate.passages)) {
          failures.push("radice dati non valida");
        }
        if (failures.length) throw new Error(failures.join("; "));
        if (candidate.questions.length !== 65) failures.push(`attese 65 domande, ricevute ${candidate.questions.length}`);
        const ids = candidate.questions.map((question) => question.id);
        if (new Set(ids).size !== ids.length) failures.push("identificatori non univoci");
        for (const definition of SECTION_DEFINITIONS) {
          const group = candidate.questions.filter((question) => question.section === definition.dataSection);
          if (group.length !== definition.questionCount) failures.push(`${definition.id}: attese ${definition.questionCount}, ricevute ${group.length}`);
        }
        for (const question of candidate.questions) {
          const optionKeys = question.options && Object.keys(question.options).sort();
          if (!optionKeys || optionKeys.join("") !== "ABCDE") failures.push(`${question.id}: alternative non A–E`);
          if (!LETTERS.includes(question.correctAnswer)) failures.push(`${question.id}: risposta corretta non valida`);
          if (!Array.isArray(question.explanationSteps) || question.explanationSteps.length === 0) failures.push(`${question.id}: spiegazione assente`);
        }
        const passages = new Set(candidate.passages.map((passage) => passage.id));
        const cvQuestions = candidate.questions.filter((question) => question.section === "Comprensione verbale");
        if (cvQuestions.some((question) => !passages.has(question.passageId))) failures.push("riferimento al brano CV non valido");
        const lm009 = candidate.questions.find((question) => question.id === "LM-009");
        if (!lm009 || JSON.stringify(lm009.explanationSteps) !== JSON.stringify(LM009_STEPS)) failures.push("LM-009 non contiene la correzione autorizzata");
        if (failures.length) throw new Error(failures.join(" · "));
      }

      function createInitialState() {
        return {
          started: false,
          finished: false,
          view: "welcome",
          activeSectionId: null,
          activeQuestionIndex: 0,
          answers: {},
          notice: "",
          timerId: null,
          closing: false,
          reviewFilter: { section: "all", outcome: "all" },
          sections: Object.fromEntries(SECTION_DEFINITIONS.map((definition) => [definition.id, {
            status: "unopened",
            startedAt: null,
            elapsedMs: 0,
            closeReason: null
          }]))
        };
      }

      function sectionState(sectionId) {
        return state.sections[sectionId];
      }

      function elapsedFor(sectionId) {
        const item = sectionState(sectionId);
        if (item.status === "active" && item.startedAt !== null) {
          return Math.min(durationFor(sectionId), item.elapsedMs + Date.now() - item.startedAt);
        }
        return Math.min(durationFor(sectionId), item.elapsedMs);
      }

      function remainingFor(sectionId) {
        return Math.max(0, durationFor(sectionId) - elapsedFor(sectionId));
      }

      function header() {
        const themeLabel = document.body.classList.contains("dark") ? "Passa al tema chiaro" : "Passa al tema scuro";
        return `
          <header class="app-header shell">
            <div class="brand" aria-label="Simulatore TOL – Ingegneria">
              <div class="brand-mark" aria-hidden="true">TOL</div>
              <div><p class="eyebrow">Pratica autonoma</p><h2>Simulatore TOL – Ingegneria</h2></div>
            </div>
            <button class="theme-button" type="button" data-action="toggle-theme" aria-pressed="${document.body.classList.contains("dark")}">${themeLabel}</button>
          </header>`;
      }

      function renderWelcome() {
        const cards = SECTION_DEFINITIONS.map((definition) => `
          <article class="card section-card">
            <h3>${escapeHtml(definition.shortLabel)}</h3>
            <p>${definition.questionCount} domande · ${definition.minutes} min</p>
            <strong>peso × ${definition.weight === 1 / 3 ? "⅓" : String(definition.weight).replace(".", ",")}</strong>
          </article>`).join("");
        app.innerHTML = `${header()}
          <main id="main-content" class="shell">
            <section class="hero" aria-labelledby="welcome-title">
              <p class="eyebrow">Esercitazione completa · 65 domande</p>
              <h1 id="welcome-title">Preparati con una simulazione concentrata e trasparente.</h1>
              <p>Affronta le quattro sezioni con tempi indipendenti, risposte a scelta multipla e una revisione dettagliata alla fine. Le soluzioni restano nascoste finché la prova non è conclusa.</p>
              <div class="independent-note">Simulatore indipendente di pratica; non è una piattaforma ufficiale del Politecnico di Milano.</div>
            </section>
            <h2 class="section-title">Struttura della simulazione</h2>
            <section class="section-grid" aria-label="Sezioni, domande, tempi e pesi">${cards}</section>
            <section class="info-grid" aria-label="Regole di punteggio e svolgimento">
              <article class="card">
                <h2>Punteggio su 100</h2>
                <div class="rules">
                  <div class="rule"><strong>+1</strong><span>risposta corretta</span></div>
                  <div class="rule"><strong>−0,25</strong><span>risposta errata</span></div>
                  <div class="rule"><strong>0</strong><span>lasciata in bianco</span></div>
                </div>
                <p class="formula">Il punteggio ponderato è calcolato senza arrotondare le sezioni: Logica × 2,6 + Comprensione × 3 + Fisica × 2 + Inglese × ⅓.</p>
              </article>
              <article class="card">
                <h2>Come funziona</h2>
                <p class="muted">Il cronometro parte entrando nella sezione, non si può mettere in pausa e il tempo non passa alla sezione successiva. Chiudere una sezione in anticipo è definitivo.</p>
              </article>
            </section>
            <div class="start-row">
              <p>Durata totale prevista: 100 minuti. Evita di ricaricare la pagina durante la prova: i progressi non vengono salvati.</p>
              <button class="button-primary" type="button" data-action="start">Inizia la simulazione</button>
            </div>
          </main>`;
      }

      function getActiveDefinition() {
        return SECTION_DEFINITIONS.find((definition) => definition.id === state.activeSectionId);
      }

      function getActiveQuestions() {
        return questionsBySection[state.activeSectionId] || [];
      }

      function getPassage(question) {
        return question.passageId ? bank.passages.find((passage) => passage.id === question.passageId) : null;
      }

      function renderPassage(passage) {
        if (!passage) return "";
        return `<aside class="passage-card" aria-labelledby="passage-${escapeHtml(passage.id)}">
          <p class="eyebrow">Brano di riferimento</p>
          <h2 id="passage-${escapeHtml(passage.id)}">${escapeHtml(passage.title)}</h2>
          <p class="passage-origin">${escapeHtml(passage.origin)}</p>
          <p class="passage-text">${withBreaks(passage.text)}</p>
        </aside>`;
      }

      function renderQuestionNavigation(questions) {
        return questions.map((question, index) => {
          const selected = state.answers[question.id];
          const classes = [index === state.activeQuestionIndex ? "is-current" : "", selected ? "is-answered" : ""].filter(Boolean).join(" ");
          const stateText = index === state.activeQuestionIndex ? ", domanda corrente" : selected ? ", risposta selezionata" : ", lasciata in bianco";
          return `<button type="button" class="${classes}" data-action="go-question" data-index="${index}" ${index === state.activeQuestionIndex ? "aria-current=\"step\"" : ""} aria-label="Domanda ${index + 1}${stateText}">${index + 1}</button>`;
        }).join("");
      }

      function renderExam() {
        const definition = getActiveDefinition();
        const questions = getActiveQuestions();
        const question = questions[state.activeQuestionIndex];
        if (!definition || !question) return;
        const selected = state.answers[question.id] || "";
        const answeredCount = questions.filter((item) => Boolean(state.answers[item.id])).length;
        const progress = ((state.activeQuestionIndex + 1) / questions.length) * 100;
        const options = LETTERS.map((letter) => `
          <label class="option">
            <input type="radio" name="answer" value="${letter}" data-answer="true" ${selected === letter ? "checked" : ""}>
            <span class="option-letter" aria-hidden="true">${letter}</span>
            <span class="option-text">${escapeHtml(question.options[letter])}</span>
          </label>`).join("");
        const previousDisabled = state.activeQuestionIndex === 0 ? "disabled" : "";
        const nextDisabled = state.activeQuestionIndex === questions.length - 1 ? "disabled" : "";
        const nextLabel = state.activeQuestionIndex === questions.length - 1 ? "Ultima domanda" : "Avanti";
        app.innerHTML = `${header()}
          <main id="main-content" class="shell exam-layout">
            <section class="exam-main" aria-labelledby="section-title">
              <div class="exam-status">
                <div class="exam-topline">
                  <div><p class="eyebrow">Sezione attiva</p><h1 id="section-title">${escapeHtml(definition.label)}</h1></div>
                  <div id="timer-box" class="clock" aria-label="Tempo rimanente"><span aria-hidden="true">◷</span><span id="timer-text">${formatDuration(remainingFor(definition.id))}</span></div>
                </div>
                <div class="progress-wrap" aria-label="Avanzamento nella sezione">
                  <div class="progress-meta"><span>Domanda ${state.activeQuestionIndex + 1} di ${questions.length}</span><span>${answeredCount} risposte selezionate</span></div>
                  <div class="progress-track" role="progressbar" aria-valuemin="1" aria-valuemax="${questions.length}" aria-valuenow="${state.activeQuestionIndex + 1}" aria-label="Domande percorse"><div class="progress-bar" style="width: ${progress}%"></div></div>
                </div>
              </div>
              ${state.notice ? `<p id="exam-notice" class="notice" role="status">${escapeHtml(state.notice)}</p>` : ""}
              ${renderPassage(getPassage(question))}
              <article class="question-card" aria-labelledby="question-title">
                <div class="question-meta"><span class="badge id">${escapeHtml(question.id)}</span><span class="badge">${escapeHtml(question.topic)}</span><span class="badge">Difficoltà: ${escapeHtml(question.difficulty)}</span></div>
                <h2 id="question-title" tabindex="-1">${escapeHtml(question.question)}</h2>
                <fieldset class="answers"><legend>Seleziona una risposta</legend>${options}</fieldset>
                <div class="question-actions">
                  <div class="group">
                    <button class="button-secondary" type="button" data-action="previous" ${previousDisabled}>Indietro</button>
                    <button class="button-primary" type="button" data-action="next" ${nextDisabled}>${nextLabel}</button>
                  </div>
                  <button class="button-quiet" type="button" data-action="blank" ${selected ? "" : "disabled"}>Lascia in bianco</button>
                </div>
              </article>
            </section>
            <aside class="exam-sidebar" aria-label="Navigazione e completamento sezione">
              <h2>Vai a una domanda</h2>
              <p>Puoi modificare le risposte finché la sezione è aperta.</p>
              <nav class="question-nav" aria-label="Domande della sezione">${renderQuestionNavigation(questions)}</nav>
              <div class="legend" aria-label="Legenda navigazione"><span><i class="current"></i> Corrente</span><span><i class="answered"></i> Con risposta</span><span><i></i> In bianco</span></div>
              <button class="button-secondary button-danger end-section" type="button" data-action="finish-section">Termina questa sezione</button>
            </aside>
          </main>`;
        updateClock();
      }

      function scoreForAnswers(answerMap = state.answers) {
        const sections = SECTION_DEFINITIONS.map((definition) => {
          let correct = 0;
          let incorrect = 0;
          let blank = 0;
          for (const question of questionsBySection[definition.id]) {
            const selected = answerMap[question.id];
            if (!selected) blank += 1;
            else if (selected === question.correctAnswer) correct += 1;
            else incorrect += 1;
          }
          const raw = correct - (incorrect * 0.25);
          return {
            ...definition,
            correct,
            incorrect,
            blank,
            raw,
            weighted: raw * definition.weight,
            accuracy: (correct / definition.questionCount) * 100,
            elapsedMs: elapsedFor(definition.id)
          };
        });
        return { sections, total: sections.reduce((sum, item) => sum + item.weighted, 0) };
      }

      function renderResults() {
        const result = scoreForAnswers();
        const overall = result.sections.reduce((accumulator, item) => ({
          correct: accumulator.correct + item.correct,
          incorrect: accumulator.incorrect + item.incorrect,
          blank: accumulator.blank + item.blank,
          elapsedMs: accumulator.elapsedMs + item.elapsedMs
        }), { correct: 0, incorrect: 0, blank: 0, elapsedMs: 0 });
        const cards = result.sections.map((item) => `
          <article class="results-card">
            <h2>${escapeHtml(item.shortLabel)}</h2>
            <p class="score">${formatScore(item.weighted)} <span class="muted">/ ${formatScore(item.questionCount * item.weight)}</span></p>
            <p class="muted">Lordo ${formatScore(item.raw)} · ${formatDuration(item.elapsedMs)} impiegati</p>
            <div class="result-list">
              <div><strong>${item.correct}</strong>corrette</div>
              <div><strong>${item.incorrect}</strong>errate</div>
              <div><strong>${item.blank}</strong>in bianco</div>
              <div><strong>${formatScore(item.accuracy)}%</strong>accuratezza</div>
            </div>
          </article>`).join("");
        app.innerHTML = `${header()}
          <main id="main-content" class="shell">
            <section class="results-head" aria-labelledby="results-title">
              <p class="eyebrow">Simulazione conclusa</p>
              <h1 id="results-title">Il tuo risultato</h1>
              <div class="score-orb" aria-label="Punteggio finale ${formatScore(result.total)} su 100"><div><strong>${formatScore(result.total)}</strong><span>su 100</span></div></div>
              <p class="muted">${overall.correct} corrette · ${overall.incorrect} errate · ${overall.blank} in bianco · ${formatDuration(overall.elapsedMs)} complessivi</p>
            </section>
            <section class="results-grid" aria-label="Risultati per sezione">${cards}</section>
            <div class="results-actions">
              <button class="button-primary" type="button" data-action="open-review">Rivedi l'esame</button>
              <button class="button-secondary" type="button" data-action="reset">Nuova simulazione</button>
            </div>
          </main>`;
      }

      function outcomeFor(question) {
        const selected = state.answers[question.id];
        if (!selected) return "blank";
        return selected === question.correctAnswer ? "correct" : "wrong";
      }

      function outcomeLabel(outcome) {
        return ({ correct: "Corretta", wrong: "Errata", blank: "In bianco" })[outcome];
      }

      function reviewQuestionCard(question) {
        const outcome = outcomeFor(question);
        const selected = state.answers[question.id];
        const passage = getPassage(question);
        const selection = selected ? `<strong>${selected}</strong> — ${escapeHtml(question.options[selected])}` : "Nessuna risposta selezionata";
        const correct = `<strong>${question.correctAnswer}</strong> — ${escapeHtml(question.options[question.correctAnswer])}`;
        const steps = question.explanationSteps.map((step) => `<li>${escapeHtml(step)}</li>`).join("");
        const distractors = Object.entries(question.distractorAnalysis).map(([letter, text]) => `<div class="distractor"><strong>${escapeHtml(letter)}.</strong> ${escapeHtml(text)}</div>`).join("");
        return `${passage ? `<div data-passage-marker="${escapeHtml(passage.id)}">${renderPassage(passage)}</div>` : ""}
          <article class="review-card status-${outcome}">
            <div class="question-meta"><span class="badge id">${escapeHtml(question.id)}</span><span class="badge">${escapeHtml(question.topic)}</span></div>
            <h2>${escapeHtml(question.question)}</h2>
            <span class="review-outcome ${outcome}">${outcomeLabel(outcome)}</span>
            <dl class="review-answer-grid">
              <div class="review-answer"><dt>La tua risposta</dt><dd>${selection}</dd></div>
              <div class="review-answer"><dt>Risposta corretta</dt><dd>${correct}</dd></div>
            </dl>
            <section class="review-section"><h3>Spiegazione</h3><ol>${steps}</ol></section>
            <section class="review-section"><h3>Analisi dei distrattori</h3><div class="distractors">${distractors}</div></section>
            <section class="review-section"><h3>Concetto valutato</h3><p>${escapeHtml(question.concept)}</p></section>
            <section class="review-section"><h3>Errore comune</h3><p>${escapeHtml(question.commonMistake)}</p></section>
          </article>`;
      }

      function renderReview() {
        const ordered = SECTION_DEFINITIONS.flatMap((definition) => questionsBySection[definition.id]);
        const filtered = ordered.filter((question) => {
          const sectionMatch = state.reviewFilter.section === "all" || question.section === SECTION_DEFINITIONS.find((definition) => definition.id === state.reviewFilter.section).dataSection;
          const outcome = outcomeFor(question);
          const outcomeMatch = state.reviewFilter.outcome === "all" || outcome === state.reviewFilter.outcome;
          return sectionMatch && outcomeMatch;
        });
        const renderedPassages = new Set();
        const list = filtered.map((question) => {
          const passage = getPassage(question);
          if (passage && renderedPassages.has(passage.id)) {
            return reviewQuestionCard(question).replace(new RegExp(`<div data-passage-marker="${passage.id}">[\\s\\S]*?<\\/div>`, ""), "");
          }
          if (passage) renderedPassages.add(passage.id);
          return reviewQuestionCard(question);
        }).join("");
        const options = SECTION_DEFINITIONS.map((definition) => `<option value="${definition.id}" ${state.reviewFilter.section === definition.id ? "selected" : ""}>${escapeHtml(definition.label)}</option>`).join("");
        app.innerHTML = `${header()}
          <main id="main-content" class="shell">
            <section class="review-header" aria-labelledby="review-title">
              <div><p class="eyebrow">Revisione dettagliata</p><h1 id="review-title">Rivedi le tue risposte</h1></div>
              <button class="button-secondary" type="button" data-action="close-review">Torna ai risultati</button>
            </section>
            <section class="card filters" aria-label="Filtri revisione">
              <label>Sezione<select data-review-filter="section"><option value="all">Tutte le sezioni</option>${options}</select></label>
              <label>Esito<select data-review-filter="outcome"><option value="all" ${state.reviewFilter.outcome === "all" ? "selected" : ""}>Tutti gli esiti</option><option value="wrong" ${state.reviewFilter.outcome === "wrong" ? "selected" : ""}>Solo errate</option><option value="blank" ${state.reviewFilter.outcome === "blank" ? "selected" : ""}>Solo in bianco</option><option value="correct" ${state.reviewFilter.outcome === "correct" ? "selected" : ""}>Solo corrette</option></select></label>
            </section>
            <p class="review-count">${filtered.length} ${filtered.length === 1 ? "domanda mostrata" : "domande mostrate"}</p>
            <section class="review-list" aria-label="Domande revisionate">${list || "<div class=\"card empty-state\">Nessuna domanda corrisponde ai filtri selezionati.</div>"}</section>
          </main>`;
      }

      function render() {
        if (state.view === "welcome") renderWelcome();
        else if (state.view === "exam") renderExam();
        else if (state.view === "results") renderResults();
        else renderReview();
      }

      function updateClock() {
        if (state.view !== "exam" || !state.activeSectionId) return;
        const remaining = remainingFor(state.activeSectionId);
        const text = document.getElementById("timer-text");
        const box = document.getElementById("timer-box");
        if (text) text.textContent = formatDuration(remaining);
        if (box) box.classList.toggle("is-low", remaining <= 60_000);
      }

      function activateSection(sectionId, notice = "") {
        const item = sectionState(sectionId);
        item.status = "active";
        item.startedAt = Date.now();
        state.activeSectionId = sectionId;
        state.activeQuestionIndex = 0;
        state.notice = notice;
        state.view = "exam";
        render();
      }

      function startExam() {
        if (state.timerId) window.clearInterval(state.timerId);
        state = createInitialState();
        state.started = true;
        activateSection(SECTION_DEFINITIONS[0].id);
        state.timerId = window.setInterval(tick, 250);
      }

      function closeSection(sectionId, reason) {
        const item = sectionState(sectionId);
        if (!item || item.status !== "active" || state.closing) return false;
        state.closing = true;
        item.elapsedMs = elapsedFor(sectionId);
        item.startedAt = null;
        item.status = "closed";
        item.closeReason = reason;
        const next = SECTION_DEFINITIONS.find((definition) => sectionState(definition.id).status === "unopened");
        if (next) {
          const notice = reason === "timeout" ? `Il tempo della sezione precedente è terminato. Ora inizia ${next.label}.` : `Sezione conclusa. Ora inizia ${next.label}.`;
          state.closing = false;
          activateSection(next.id, notice);
        } else {
          state.activeSectionId = null;
          state.finished = true;
          state.view = "results";
          if (state.timerId) window.clearInterval(state.timerId);
          state.timerId = null;
          state.closing = false;
          render();
        }
        return true;
      }

      function finishActiveSection() {
        const definition = getActiveDefinition();
        if (!definition) return;
        const confirmed = window.confirm(`Terminare definitivamente la sezione “${definition.label}”? Le risposte in bianco resteranno tali e non sarà possibile tornare indietro.`);
        if (confirmed) closeSection(definition.id, "manual");
      }

      function tick() {
        if (!state.started || state.finished || state.view !== "exam" || !state.activeSectionId) return;
        if (remainingFor(state.activeSectionId) <= 0) {
          closeSection(state.activeSectionId, "timeout");
          return;
        }
        updateClock();
      }

      function chooseAnswer(letter) {
        const questions = getActiveQuestions();
        const question = questions[state.activeQuestionIndex];
        if (!question || !LETTERS.includes(letter) || sectionState(state.activeSectionId).status !== "active") return;
        state.answers[question.id] = letter;
        renderExam();
        requestAnimationFrame(() => app.querySelector(`input[data-answer][value="${letter}"]`)?.focus());
      }

      function blankAnswer() {
        const question = getActiveQuestions()[state.activeQuestionIndex];
        if (!question) return;
        delete state.answers[question.id];
        renderExam();
        requestAnimationFrame(() => app.querySelector('[data-action="blank"]')?.focus());
      }

      function changeQuestion(index) {
        const questions = getActiveQuestions();
        if (!Number.isInteger(index) || index < 0 || index >= questions.length) return;
        state.activeQuestionIndex = index;
        renderExam();
        requestAnimationFrame(() => document.getElementById("question-title")?.focus?.());
      }

      function resetExam() {
        const confirmed = window.confirm("Iniziare una nuova simulazione? Tutte le risposte e i risultati correnti verranno rimossi.");
        if (!confirmed) return;
        if (state.timerId) window.clearInterval(state.timerId);
        state = createInitialState();
        render();
      }

      app.addEventListener("click", (event) => {
        const control = event.target.closest("[data-action]");
        if (!control || control.disabled) return;
        switch (control.dataset.action) {
          case "toggle-theme":
            document.body.classList.toggle("dark");
            render();
            break;
          case "start": startExam(); break;
          case "previous": changeQuestion(state.activeQuestionIndex - 1); break;
          case "next": changeQuestion(state.activeQuestionIndex + 1); break;
          case "go-question": changeQuestion(Number(control.dataset.index)); break;
          case "blank": blankAnswer(); break;
          case "finish-section": finishActiveSection(); break;
          case "open-review": state.view = "review"; render(); break;
          case "close-review": state.view = "results"; render(); break;
          case "reset": resetExam(); break;
          default: break;
        }
      });

      app.addEventListener("change", (event) => {
        if (event.target.matches("input[data-answer]")) chooseAnswer(event.target.value);
        if (event.target.matches("select[data-review-filter]")) {
          state.reviewFilter[event.target.dataset.reviewFilter] = event.target.value;
          renderReview();
        }
      });

      window.addEventListener("beforeunload", (event) => {
        if (state && state.started && !state.finished) {
          event.preventDefault();
          event.returnValue = "";
        }
      });

      function initialize() {
        try {
          const source = document.getElementById("bank-data").textContent;
          bank = JSON.parse(source);
          validateBank(bank);
          questionsBySection = Object.fromEntries(SECTION_DEFINITIONS.map((definition) => [definition.id, bank.questions.filter((question) => question.section === definition.dataSection)]));
          state = createInitialState();
          render();
        } catch (error) {
          console.error(error);
          app.innerHTML = `<main class="shell"><section class="error-screen"><h1>Impossibile avviare il simulatore</h1><p>I dati incorporati non hanno superato il controllo di integrità.</p><p class="muted">${escapeHtml(error.message)}</p></section></main>`;
        }
      }

      initialize();
    })();
  </script>
</body>
</html>
